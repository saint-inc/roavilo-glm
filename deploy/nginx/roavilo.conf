# =====================================================================
# roavilo.com Nginx 部署配置（CentOS Stream 8 + Nginx + PHP-FPM）
# 部署路径：/etc/nginx/conf.d/roavilo.conf
#
# 说明：
# - 主站 www.roavilo.com / roavilo.com：PC 端（响应式布局同时适配 iPad/手机）
# - m.roavilo.com：移动端入口（当前与主站同一应用，前端为响应式设计）
# - kf.roavilo.com：客服中心（预留，当前指向主应用 /kf 路径）
# - 所有 HTTP 请求 301 跳转 HTTPS（证书可用 certbot 免费申请）
# =====================================================================

# ---------- HTTP：全部跳转 HTTPS ----------
server {
    listen 80;
    server_name roavilo.com www.roavilo.com m.roavilo.com t.roavilo.com kf.roavilo.com
               merchant.roavilo.com zhaopin.roavilo.com h5.roavilo.com union.roavilo.com;
    return 301 https://$host$request_uri;
}

# ---------- 主站（www / 根域名） ----------
server {
    listen 443 ssl http2;
    server_name roavilo.com www.roavilo.com;

    # SSL 证书（certbot 签发后路径示例）
    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    # Laravel 项目根目录指向 public
    root /var/www/roavilo/public;
    index index.php index.html;

    # 字符集与日志
    charset utf-8;
    access_log /var/log/nginx/roavilo.access.log;
    error_log  /var/log/nginx/roavilo.error.log;

    # 上传文件大小限制（头像等图片）
    client_max_body_size 10m;

    location / {
        # Laravel 前端控制器：所有请求转发给 index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 静态资源缓存 30 天
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # PHP-FPM 处理（CentOS Stream 8 默认 unix socket）
    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 禁止访问隐藏文件（.env / .git 等）
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------- 移动端 m.roavilo.com（同一应用，响应式自适应） ----------
server {
    listen 443 ssl http2;
    server_name m.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    root /var/www/roavilo/public;
    index index.php;

    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ---------- 客服中心 kf.roavilo.com（预留入口） ----------
server {
    listen 443 ssl http2;
    server_name kf.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    # 当前直接反代到主应用的 /kf 路径（后续可独立部署客服系统）
    location / {
        proxy_pass https://www.roavilo.com/kf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---------- 商户中心 merchant.roavilo.com（对应 e.dianping.com） ----------
# 反代主站并透传 Host，由 Laravel RewriteSubdomainPath 中间件
# 把子域路径重写到 /merchant 前缀（如 /shops/1/dashboard → /merchant/shops/1/dashboard）
server {
    listen 443 ssl http2;
    server_name merchant.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass https://www.roavilo.com;
        proxy_set_header Host merchant.roavilo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}

# ---------- 招聘 zhaopin.roavilo.com（对应 hr.dianping.com / zhaopin.dianping.com） ----------
# Laravel 中间件把子域路径重写到 /jobs
server {
    listen 443 ssl http2;
    server_name zhaopin.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    location / {
        proxy_pass https://www.roavilo.com;
        proxy_set_header Host zhaopin.roavilo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}

# ---------- H5/下载页 h5.roavilo.com（对应 h5.dianping.com） ----------
# Laravel 中间件把子域路径重写到 /app
server {
    listen 443 ssl http2;
    server_name h5.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    location / {
        proxy_pass https://www.roavilo.com;
        proxy_set_header Host h5.roavilo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}

# ---------- API 网关 union.roavilo.com（对应 union.dianping.com） ----------
# 返回 JSON 欢迎响应（与 dianping union 网关行为一致），无页面
server {
    listen 443 ssl http2;
    server_name union.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    location / {
        proxy_pass https://www.roavilo.com;
        proxy_set_header Host union.roavilo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}
# ---------- 团购子域 t.roavilo.com（对应 t.dianping.com） ----------
server {
    listen 443 ssl http2;
    server_name t.roavilo.com;

    ssl_certificate     /etc/letsencrypt/live/roavilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roavilo.com/privkey.pem;

    # 反代到主应用的 /t 路径（团购列表），团购详情 /deal/{id} 同样可从子域访问
    location / {
        proxy_pass https://www.roavilo.com/t;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 团购详情直达（t.roavilo.com/deal/xxx → 主站 /deal/xxx）
    location /deal/ {
        proxy_pass https://www.roavilo.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

